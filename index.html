<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>夢アカ 受付（検証用）</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;margin:0;background:#16213e;color:#fff}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:18px;margin:6px 0 12px}
label{font-size:13px;opacity:.85}
input,button{font-size:17px;padding:10px;border-radius:10px;border:0;width:100%;box-sizing:border-box;margin:4px 0 10px}
button{background:#009688;color:#fff;font-weight:700}
button.sub{background:#3a4670;font-weight:400;font-size:14px}
#v{width:100%;border-radius:14px;background:#000;display:none}
#msg{margin:12px 0;padding:16px;border-radius:14px;font-size:20px;font-weight:700;background:#2a3558;min-height:56px;white-space:pre-line}
.ok{background:#1b8a5a!important}.out{background:#1565c0!important}.warn{background:#b26a00!important}.ng{background:#b3261e!important}
.box{background:#222c4d;border-radius:14px;padding:12px;margin:10px 0;font-size:15px;line-height:1.7}
.row{display:flex;gap:8px}.row input{flex:1}.row button{width:auto;white-space:nowrap}
small{opacity:.7;line-height:1.6;display:block}
.hide{display:none}
#code{letter-spacing:.15em;text-transform:uppercase;text-align:center;font-size:22px}
</style>
</head>
<body>
<main>
<h1>夢アカ 受付（検証用）</h1>

<div id="reg" class="hide">
  <div class="box">
    この端末は、まだ受付用に登録されていません。<br>
    Discordで「受付の端末を登録する」を押すと、登録コードが届きます。
  </div>
  <label>登録コード</label>
  <input id="code" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX">
  <button id="regbtn">この端末を登録する</button>
</div>

<div id="app" class="hide">
  <video id="v" playsinline muted></video>
  <canvas id="c" class="hide"></canvas>
  <button id="cam" class="hide">カメラを始める</button>
  <div id="msg">準備中</div>
  <div class="row"><input id="manual" placeholder="管理番号を手で入力（例 5-01）"><button id="mbtn">記録</button></div>
  <div class="box"><b>到着済み</b> <span id="n1"></span><div id="l1"></div></div>
  <div class="box"><b>予約したがまだ来ていない</b> <span id="n2"></span><div id="l2"></div></div>
  <div class="box"><b>帰った人</b> <span id="n3"></span><div id="l3"></div></div>
  <label>活動日</label>
  <input id="day" type="date">
  <small id="who"></small>
  <button id="forget" class="sub">この端末の登録を消す</button>
</div>

<div id="msg0" class="box hide"></div>
</main>
<script src="jsQR.js"></script>
<script>
(function(){
var API='https://yasuulab-n8n.xvps.jp/webhook/yumeaka-yoyaku-uketsuke-api-5f0c2b';
var STORE='yumeaka_uketsuke_v1';
var $=function(i){return document.getElementById(i)};
function load(){try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){return null}}
function save(o){try{localStorage.setItem(STORE,JSON.stringify(o));return true}catch(e){return false}}
function clear(){try{localStorage.removeItem(STORE)}catch(e){}}
function show(t,c){var m=$('msg');m.textContent=t;m.className=c||''}
function note(t){var m=$('msg0');m.textContent=t;m.className='box'+(t?'':' hide')}
function post(o){var b=new URLSearchParams();for(var k in o)b.set(k,o[k]);return fetch(API,{method:'POST',body:b}).then(function(x){return x.json()})}
function randHex(n){var a=new Uint8Array(n);crypto.getRandomValues(a);var s='';for(var i=0;i<n;i++)s+=('0'+a[i].toString(16)).slice(-2);return s}

var me=load();
var q=new URLSearchParams(location.search);
var today=new Date(Date.now()+9*3600*1000).toISOString().slice(0,10);
var last='',lastAt=0,busy=false,camOn=false;

function lists(r){if(!r||!r.lists)return;
$('n1').textContent='（'+r.lists.arrived.length+'人）';$('l1').textContent=r.lists.arrived.join('、')||'まだいません';
$('n2').textContent='（'+r.lists.notYet.length+'人）';$('l2').textContent=r.lists.notYet.join('、')||'いません';
$('n3').textContent='（'+r.lists.left.length+'人）';$('l3').textContent=r.lists.left.join('、')||'いません'}

function send(code){if(busy)return;busy=true;
post({op:code?'scan':'open',device:me.device,key:me.key,day:$('day').value,code:code||''}).then(function(r){busy=false;
if(r.auth===false){stopCam();show(r.message,'ng');return}
lists(r);
if(!code){show('ネームプレートのQRコードをかざしてください','');return}
show(r.message,r.cls||'')}).catch(function(e){busy=false;show('通信に失敗しました。もう一度かざしてください。','ng')})}

function tick(){if(!camOn)return;var v=$('v');
if(v.readyState===v.HAVE_ENOUGH_DATA){var c=$('c');c.width=v.videoWidth;c.height=v.videoHeight;var x=c.getContext('2d');x.drawImage(v,0,0);
var im=x.getImageData(0,0,c.width,c.height);var r=window.jsQR?jsQR(im.data,c.width,c.height):null;
if(r&&r.data){var now=Date.now();if(r.data!==last||now-lastAt>5000){last=r.data;lastAt=now;send(r.data)}}}
setTimeout(tick,250)}

function stopCam(){camOn=false;var v=$('v');if(v.srcObject){v.srcObject.getTracks().forEach(function(t){t.stop()});v.srcObject=null}v.style.display='none'}

function startCam(){
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){show('この画面ではカメラが使えません。管理番号を手で入力してください。','warn');return}
navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(s){var v=$('v');v.srcObject=s;v.style.display='block';$('cam').className='hide';
var p=v.play();if(p&&p.catch)p.catch(function(){});camOn=true;tick()}).catch(function(e){$('cam').className='';
show('カメラを開けませんでした（'+e.name+'）。\n「カメラを始める」を押すか、管理番号を手で入力してください。','warn')})}

function openApp(){$('reg').className='hide';$('app').className='';note('');
$('day').value=q.get('day')||today;
$('who').textContent='この端末：'+me.name+'（'+me.device+'）';
send('');startCam()}

function openReg(){$('app').className='hide';$('reg').className='';
var h=new URLSearchParams(location.hash.replace(/^#/,''));if(h.get('t'))$('code').value=h.get('t')}

$('regbtn').onclick=function(){var code=$('code').value.replace(/[^0-9A-Za-z]/g,'').toUpperCase();
if(code.length<8){note('登録コードを入れてください。');return}
var key=randHex(32);note('登録しています…');
post({op:'register',code:code,key:key}).then(function(r){
if(!r.ok){note(r.message||'登録できませんでした。');return}
me={device:r.device,key:key,name:r.name};
if(!save(me)){note('この端末は情報を保存できない設定のため、登録できませんでした。\nプライベートブラウズを切るか、ふだん使っているブラウザで開き直してください。');me=null;return}
history.replaceState(null,'',location.pathname+location.search);
openApp()}).catch(function(e){note('通信に失敗しました。もう一度試してください。')})};

$('cam').onclick=startCam;
$('mbtn').onclick=function(){var m=$('manual').value.trim();if(m){send('yumeaka:'+m);$('manual').value=''}};
$('day').onchange=function(){send('')};
$('forget').onclick=function(){if(window.confirm('この端末の登録を消します。もう一度使うには、Discordからの登録が必要です。')){stopCam();clear();me=null;openReg()}};

if(me&&me.device&&me.key)openApp();else openReg();
})();
</script>
</body>
</html>
