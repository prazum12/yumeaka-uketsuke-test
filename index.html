<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#16213e">
<title>夢アカ 受付（検証用）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css?v=8">
<style>
.finder{position:relative;border-radius:22px;overflow:hidden;background:#0d1326;aspect-ratio:4/3;margin:12px 0 0}
.finder video{width:100%;height:100%;object-fit:cover;display:block}
.finder .frame{position:absolute;inset:14% 22%;pointer-events:none}
.finder .frame i{position:absolute;width:34px;height:34px;border:5px solid #fff;border-radius:6px}
.finder .frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
.finder .frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.finder .frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
.finder .frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.finder .hint{position:absolute;left:10px;right:10px;bottom:10px;text-align:center;color:#fff;font-family:var(--round);font-weight:700;font-size:14px;text-shadow:0 1px 4px #000}
.finder .start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
.result{display:flex;align-items:center;gap:16px;border-radius:18px;padding:16px;margin:12px 0;background:var(--paper);border:1px solid var(--line);min-height:138px}
.result .who{font-family:var(--round);font-weight:900;font-size:30px;line-height:1.2}
.result .what{font-size:16px;font-weight:700;margin-top:4px;white-space:pre-line}
.result.r-ok{background:var(--here-bg);color:var(--here-ink);border-color:transparent}
.result.r-out{background:var(--gone-bg);color:var(--gone-ink);border-color:transparent}
.result.r-warn{background:var(--yet-bg);color:var(--yet-ink);border-color:transparent}
.result.r-ng{background:var(--late-bg);color:#8f1d15;border-color:transparent}
.result.r-idle{color:var(--ink-2)}
.result.r-idle .stamp{opacity:.25}
.list{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 12px}
.list .chips{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.manual{display:flex;gap:8px}.manual input{flex:1}.manual button{width:auto;margin:0;white-space:nowrap;padding:0 18px;font-size:16px}
#code{letter-spacing:.18em;text-transform:uppercase;text-align:center;font-family:var(--round);font-weight:900;font-size:26px}
</style>
</head>
<body>
<header class="band"><div class="band-in">
  <div class="mark">YUME ACADEMY<small>横須賀プログラミング"夢"アカデミー</small></div>
  <div class="band-title">受付<small id="dayLabel">検証用</small></div>
</div></header>
<main>

<section id="reg" class="hide">
  <div class="card">
    <h2>この端末を受付用に登録します</h2>
    <p class="txt">Discordの運営用チャンネルで「受付の端末を登録する」を押すと、登録コードが届きます。</p>
    <label for="code">登録コード</label>
    <input id="code" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX">
    <button id="regbtn" class="btn">登録する</button>
    <div id="msg0" class="note hide"></div>
  </div>
</section>

<section id="app" class="hide">
  <div class="finder">
    <video id="v" playsinline muted></video>
    <div class="frame" id="frame"><i></i><i></i><i></i><i></i></div>
    <div class="hint" id="hint">ネームプレートのQRコードを枠に入れる</div>
    <div class="shutter hide" id="shutterWrap"><button class="back" id="pcancel">やめる</button><button class="snap" id="snap" aria-label="顔写真を撮る"></button><button class="back" id="flip">内側のカメラ</button></div>
    <div class="start hide" id="startWrap"><button id="cam" class="btn">カメラを始める</button></div>
  </div>
  <canvas id="c" class="hide"></canvas>

  <div id="result" class="result r-idle" aria-live="assertive">
    <img id="face" class="face hide" alt="登録されている顔写真">
    <div class="stamp wait" id="stamp"></div>
    <div><div class="who" id="who2">準備しています</div><div class="what" id="what"></div></div>
  </div>

  <button id="shoot" class="btn quiet hide">顔写真を撮る</button>
  <div id="confirm" class="two hide"><button id="psave" class="btn">この写真で保存</button><button id="pretry" class="btn quiet">撮り直す</button></div>

  <div class="tiles">
    <button class="tile t-yet" data-k="notYet"><div class="num" id="n2">–</div><div class="lab">まだ来ていない</div></button>
    <button class="tile t-here on" data-k="arrived"><div class="num" id="n1">–</div><div class="lab">来ている</div></button>
    <button class="tile t-gone" data-k="left"><div class="num" id="n3">–</div><div class="lab">帰った</div></button>
  </div>
  <div class="list"><div class="chips" id="names"><div class="sk" style="margin:0;border:0;padding:4px"><i class="w80"></i><i class="w60"></i></div></div></div>

  <details>
    <summary>ネームプレートを忘れた人・日付の変更</summary>
    <label for="manual">管理番号を手で入れる</label>
    <div class="manual"><input id="manual" placeholder="例 Y5-01" inputmode="text"><button id="mbtn" class="btn">記録</button></div>
    <label for="day">活動日</label>
    <input id="day" type="date">
    <small class="foot" id="who"></small>
    <button id="forget" class="btn danger">この端末の登録を消す</button>
  </details>
</section>
</main>

<nav class="dock hide" id="dock"><div class="dock-in">
  <a href="./" class="on"><b>▣</b>受付</a>
  <a href="kanri.html"><b>☰</b>運営</a>
</div></nav>

<script src="jsQR.js"></script>
<script>
(function(){
var API='https://yasuulab-n8n.xvps.jp/webhook/yumeaka-yoyaku-uketsuke-api-5f0c2b';
var KANRI='https://yasuulab-n8n.xvps.jp/webhook/yumeaka-yoyaku-kanri-api-4c81d9';
var STORE='yumeaka_uketsuke_v1';
var $=function(i){return document.getElementById(i)};
function load(){try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){return null}}
function save(o){try{localStorage.setItem(STORE,JSON.stringify(o));return true}catch(e){return false}}
function clear(){try{localStorage.removeItem(STORE)}catch(e){}}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function note(t,c){var m=$('msg0');m.textContent=t;m.className='note '+(c||'ng')+(t?'':' hide')}
function postTo(u,o){var b=new URLSearchParams();for(var k in o)b.set(k,o[k]);return fetch(u,{method:'POST',body:b}).then(function(x){return x.json()})}
function post(o){return postTo(API,o)}
function randHex(n){var a=new Uint8Array(n);crypto.getRandomValues(a);var s='';for(var i=0;i<n;i++)s+=('0'+a[i].toString(16)).slice(-2);return s}
var WD=['日','月','火','水','木','金','土'];
function dayText(d){var p=d.split('-');if(p.length<3)return '';var w=new Date(Date.UTC(+p[0],p[1]-1,+p[2])).getUTCDay();return (+p[1])+'月'+(+p[2])+'日（'+WD[w]+'）'}

var me=load();
var q=new URLSearchParams(location.search);
var today=new Date(Date.now()+9*3600*1000).toISOString().slice(0,10);
var last='',lastAt=0,busy=false,camOn=false,L={arrived:[],notYet:[],left:[]},tab='arrived';

/* 読み取りの結果を、はんこと大きな名前で見せる */
var mode='scan',target=null,shot='',facing='environment';
function photoHint(){return (target?target.who+' さんの':'')+'顔を枠に入れて、赤い丸を押す'}
function face(src){var f=$('face');if(src){f.src=src;f.className='face';$('result').classList.add('has-face')}else{f.removeAttribute('src');f.className='face hide';$('result').classList.remove('has-face')}}
function setTarget(r){if(r&&r.no&&!r.guest){target={no:r.no,who:r.who||''};$('shoot').className='btn quiet';$('shoot').textContent=r.hasPhoto?'顔写真を撮り直す':'顔写真を撮る（まだ登録されていません）'}else{target=null;$('shoot').className='btn quiet hide'}}
function scanMode(){mode='scan';$('shutterWrap').className='shutter hide';$('confirm').className='two hide';$('hint').textContent='ネームプレートのQRコードを枠に入れる';
/* 内側のカメラで撮ったあとは、QRコードを読むために外側のカメラへ戻す */
if(facing==='user'){facing='environment';startCam()}}
function show(kind,stamp,who,what,pop){var r=$('result');r.className='result r-'+kind+($('face').className==='face'?' has-face':'');var s=$('stamp');s.textContent=stamp;
s.className='stamp';if(pop){void s.offsetWidth;s.className='stamp pop'}$('who2').textContent=who;$('what').textContent=what||''}
function showMsg(message,cls,scanned){var i=message.indexOf('\n');var who=i>=0?message.slice(0,i):message;var what=i>=0?message.slice(i+1):'';
var kind=cls==='out'?'out':cls==='warn'?'warn':cls==='ok'?'ok':'ng';
var stamp=kind==='out'?'退出':kind==='ng'?'不可':(i>=0?'到着':'済');
show(kind,stamp,who.replace(/ さん$/,' さん'),what,scanned);
if(scanned&&navigator.vibrate){try{navigator.vibrate(kind==='ng'?[60,60,60]:kind==='warn'?[120,60,120]:120)}catch(e){}}}
function idle(){face('');setTarget(null);show('idle','受付','読み取りを待っています','')}
function waiting(){show('idle','','準備しています','名簿と予約を確かめています');$('stamp').className='stamp wait'}

function names(){var box=$('names');box.textContent='';var a=L[tab]||[];var k=tab==='arrived'?'here':tab==='left'?'gone':'yet';
box.parentNode.className='list sec s-'+k;
if(!a.length){box.appendChild(el('div','empty',tab==='notYet'?'全員そろっています':tab==='arrived'?'まだ誰も来ていません':'まだ誰も帰っていません'));return}
a.forEach(function(t){var m=/^(.*)（(.*)）$/.exec(t);var c=el('div','chip');c.appendChild(el('div','cname',m?m[1]:t));if(m)c.appendChild(el('div','csub',m[2]));box.appendChild(c)})}
function lists(r){if(!r||!r.lists)return;L=r.lists;$('n1').textContent=L.arrived.length;$('n2').textContent=L.notYet.length;$('n3').textContent=L.left.length;names()}
Array.prototype.forEach.call(document.querySelectorAll('.tile'),function(b){b.onclick=function(){tab=b.dataset.k;Array.prototype.forEach.call(document.querySelectorAll('.tile'),function(x){x.className=x.className.replace(/\s*on$/,'')});b.className+=' on';names()}});

function send(code){if(busy)return;busy=true;document.body.classList.add('busy');
post({op:code?'scan':'open',device:me.device,key:me.key,day:$('day').value,code:code||''}).then(function(r){busy=false;document.body.classList.remove('busy');
if(r.auth===false){stopCam();show('ng','不可','この端末では受付できません',r.message);return}
lists(r);$('dayLabel').textContent=dayText($('day').value)||'検証用';
if(!code){idle();return}
face(r.photo||'');setTarget(r);showMsg(r.message,r.cls||'',true)}).catch(function(){busy=false;document.body.classList.remove('busy');show('ng','不可','通信に失敗しました','もう一度かざしてください。',true)})}

function tick(my){if(!camOn||my!==camTry)return;var v=$('v');
if(v.readyState===v.HAVE_ENOUGH_DATA){var c=$('c');c.width=v.videoWidth;c.height=v.videoHeight;var x=c.getContext('2d');x.drawImage(v,0,0);
var im=x.getImageData(0,0,c.width,c.height);var r=window.jsQR?jsQR(im.data,c.width,c.height):null;
if(mode==='scan'&&r&&r.data){var now=Date.now();if(r.data!==last||now-lastAt>5000){last=r.data;lastAt=now;send(r.data)}}}
setTimeout(function(){tick(my)},250)}
function stopCam(){camOn=false;var v=$('v');if(v.srcObject){v.srcObject.getTracks().forEach(function(t){t.stop()});v.srcObject=null}}
function camOff(text){$('startWrap').className='start';$('frame').className='frame hide';$('shutterWrap').className='shutter hide';$('hint').textContent=text}
var camTry=0;
function startCam(){
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){camOff('この画面ではカメラが使えません。下の欄から管理番号を入れてください。');return}
stopCam();var my=++camTry;
$('startWrap').className='start hide';$('frame').className='frame hide';$('hint').textContent='カメラを準備しています。許可を聞かれたら「許可」を選んでください';
/* 許可の画面が出ない・返事が返らない機種があるので、数秒たっても始まらなければボタンを出す */
setTimeout(function(){if(my===camTry&&!camOn)camOff('カメラが始まりません。下のボタンを押してください')},4500);
navigator.mediaDevices.getUserMedia({video:{facingMode:facing}}).then(function(s){if(my!==camTry){s.getTracks().forEach(function(t){t.stop()});return}
var v=$('v');v.srcObject=s;s.getTracks().forEach(function(t){t.onended=function(){if(my===camTry){camOn=false;camOff('カメラが止まりました。下のボタンを押してください')}}});
$('startWrap').className='start hide';$('frame').className='frame';$('hint').textContent='ネームプレートのQRコードを枠に入れる';
v.style.transform=facing==='user'?'scaleX(-1)':'';$('flip').textContent=facing==='user'?'外側のカメラ':'内側のカメラ';
var p=v.play();if(p&&p.catch)p.catch(function(){});camOn=true;
if(mode==='photo'&&target){$('shutterWrap').className='shutter';$('hint').textContent=photoHint()}else if(mode==='confirm'){$('hint').textContent='下のボタンで、保存するか撮り直すかを選ぶ'}else scanMode();
tick(my)}).catch(function(e){if(my!==camTry)return;camOn=false;camOff('カメラを開けませんでした（'+e.name+'）。下のボタンでもう一度試せます')})}
/* ほかの画面へ移るときはカメラを手放し、戻ってきたら始め直す */
window.addEventListener('pagehide',function(){camTry++;stopCam()});
window.addEventListener('pageshow',function(e){if(e.persisted&&me&&me.device)startCam()});
document.addEventListener('visibilitychange',function(){if(document.visibilityState!=='visible'||!me||!me.device)return;var v=$('v');var live=v.srcObject&&v.srcObject.getTracks().some(function(t){return t.readyState==='live'});if(!live)startCam()});

function openApp(){$('reg').className='hide';$('app').className='';$('dock').className='dock';note('');
$('who').textContent='この端末：'+me.name+'（'+me.device+'）';
waiting();startCam();
if(q.get('day')){$('day').value=q.get('day');send('');return}
$('day').value=today;
postTo(KANRI,{op:'nextday',device:me.device,key:me.key}).then(function(r){if(r&&r.day)$('day').value=r.day;send('')}).catch(function(){send('')})}
function openReg(){$('app').className='hide';$('dock').className='dock hide';$('reg').className='';
var h=new URLSearchParams(location.hash.replace(/^#/,''));if(h.get('t'))$('code').value=h.get('t')}

$('regbtn').onclick=function(){var code=$('code').value.replace(/[^0-9A-Za-z]/g,'').toUpperCase();
if(code.length<8){note('登録コードを入れてください。');return}
var key=randHex(32);note('登録しています…','warn');document.body.classList.add('busy');$('regbtn').disabled=true;
post({op:'register',code:code,key:key}).then(function(r){document.body.classList.remove('busy');$('regbtn').disabled=false;
if(!r.ok){note(r.message||'登録できませんでした。');return}
me={device:r.device,key:key,name:r.name};
if(!save(me)){note('この端末は情報を保存できない設定のため、登録できませんでした。\nプライベートブラウズを切るか、ふだん使っているブラウザで開き直してください。');me=null;return}
history.replaceState(null,'',location.pathname+location.search);
openApp()}).catch(function(){document.body.classList.remove('busy');$('regbtn').disabled=false;note('通信に失敗しました。もう一度試してください。')})};
$('cam').onclick=startCam;
$('shoot').onclick=function(){if(!target)return;if(!camOn){show('ng','不可','カメラが使えません','カメラを始めてから、もう一度押してください。');return}
mode='photo';$('shoot').className='btn quiet hide';$('confirm').className='two hide';$('shutterWrap').className='shutter';$('hint').textContent=photoHint()};
$('flip').onclick=function(){facing=facing==='user'?'environment':'user';startCam()};
$('pcancel').onclick=function(){scanMode();setTarget({no:target.no,who:target.who,hasPhoto:$('face').className==='face'})};
$('snap').onclick=function(){var v=$('v');if(!v.videoWidth)return;var s=Math.min(v.videoWidth,v.videoHeight);var c=document.createElement('canvas');c.width=280;c.height=280;
c.getContext('2d').drawImage(v,(v.videoWidth-s)/2,(v.videoHeight-s)/2,s,s,0,0,280,280);
shot=c.toDataURL('image/jpeg',0.72);if(shot.length>46000)shot=c.toDataURL('image/jpeg',0.5);
mode='confirm';$('shutterWrap').className='shutter hide';$('confirm').className='two';face(shot);show('warn','確認',target.who+' さん','この写真で保存しますか？');$('hint').textContent='下のボタンで、保存するか撮り直すかを選ぶ'};
$('pretry').onclick=function(){mode='photo';$('confirm').className='two hide';$('shutterWrap').className='shutter';$('hint').textContent=photoHint()};
$('psave').onclick=function(){if(busy)return;busy=true;document.body.classList.add('busy');$('psave').disabled=true;
post({op:'photo',device:me.device,key:me.key,no:target.no,image:shot}).then(function(r){busy=false;document.body.classList.remove('busy');$('psave').disabled=false;
if(r.auth===false){scanMode();show('ng','不可','この端末では保存できません',r.message);return}
scanMode();if(r.saved){face(shot);setTarget({no:target.no,who:target.who,hasPhoto:true});showMsg(r.message,'ok',true)}else{showMsg(r.message||'保存できませんでした','ng',true);setTarget({no:target.no,who:target.who,hasPhoto:false})}
}).catch(function(){busy=false;document.body.classList.remove('busy');$('psave').disabled=false;show('ng','不可','通信に失敗しました','もう一度「この写真で保存」を押してください。',true)})};
$('mbtn').onclick=function(){var m=$('manual').value.trim();if(m){send('yumeaka:'+m);$('manual').value=''}};
$('day').onchange=function(){send('')};
$('forget').onclick=function(){var k=$('forget');
if(!k.dataset.sure){k.dataset.sure='1';k.textContent='本当に消す（もう一度押す）';setTimeout(function(){delete k.dataset.sure;k.textContent='この端末の登録を消す'},6000);return}
delete k.dataset.sure;k.textContent='この端末の登録を消す';stopCam();var old=me;
var fin=function(){clear();me=null;openReg()};
postTo(KANRI,{op:'forget',device:old.device,key:old.key}).then(fin).catch(fin)};

if(me&&me.device&&me.key)openApp();else openReg();
})();
</script>
</body>
</html>
