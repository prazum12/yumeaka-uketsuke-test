<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>夢アカ 運営画面（検証用）</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;margin:0;background:#f4f1ea;color:#1c2540}
main{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:18px;margin:6px 0 2px}
#who{font-size:14px;opacity:.75;margin:0 0 10px}
nav{display:flex;gap:8px;margin:10px 0 14px;flex-wrap:wrap}
nav a,nav button{font-size:15px;padding:10px 14px;border-radius:999px;border:0;background:#e0ddd4;color:#1c2540;text-decoration:none;font-weight:700}
nav button.on{background:#1c2540;color:#fff}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.card h2{font-size:20px;margin:0 0 6px}
.meta{font-size:14px;line-height:1.7;opacity:.8}
.big{font-size:26px;font-weight:700;margin:8px 0 2px}
.floor{display:inline-block;padding:4px 10px;border-radius:8px;background:#e6f4f1;color:#00796b;font-weight:700;font-size:14px}
h3{font-size:14px;margin:14px 0 4px;opacity:.7}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:7px 4px;border-top:1px solid #eee;vertical-align:top}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:700}
.here{background:#d7f0e3;color:#0b6b43}.yet{background:#f0f0f0;color:#666}.stop{background:#fbdcda;color:#9a1c14}.live{background:#d7f0e3;color:#0b6b43}
.txt{font-size:15px;line-height:1.7}
button.act{font-size:14px;padding:8px 12px;border-radius:10px;border:0;background:#009688;color:#fff;font-weight:700}
button.warn{background:#b3261e}button.sub{background:#e0e0e0;color:#333}
#msg{margin:10px 0;padding:12px;border-radius:12px;font-size:16px;font-weight:700;white-space:pre-line;display:none}
.ok{background:#d7f0e3;color:#0b6b43}.ng{background:#fbdcda;color:#9a1c14}
pre{white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.7;background:#f7f7f7;border-radius:10px;padding:10px;margin:8px 0}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.hide{display:none}
small{opacity:.65;line-height:1.6;display:block}

.dayhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dayhead h2{margin:0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 8px}
.tile{border-radius:14px;padding:12px 6px;text-align:center}
.tile .num{font-size:34px;font-weight:800;line-height:1}
.tile .lab{font-size:13px;font-weight:700;margin-top:4px}
.t-yet{background:#fff1d6;color:#8a5a00}.t-here{background:#d7f0e3;color:#0b6b43}.t-gone{background:#dbe8fb;color:#134a96}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:#eee;margin:0 0 6px}
.seg.t-yet{background:#f2b84b}.seg.t-here{background:#2e9e6b}.seg.t-gone{background:#4a86d8}
.sec{margin-top:14px;border-radius:14px;padding:10px}
.s-yet{background:#fff8ea}.s-here{background:#eefaf3}.s-gone{background:#eef4fd}
.sechead{font-size:15px;font-weight:800;margin:0 2px 8px}
.s-yet .sechead{color:#8a5a00}.s-here .sechead{color:#0b6b43}.s-gone .sechead{color:#134a96}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.chip{background:#fff;border-radius:12px;padding:9px 11px;border-left:6px solid #ccc}
.s-yet .chip{border-left-color:#f2b84b}.s-here .chip{border-left-color:#2e9e6b}.s-gone .chip{border-left-color:#4a86d8}
.chip.late{border-left-color:#d93025;background:#fff5f4}
.ctop{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cname{font-size:18px;font-weight:800}
.csub{font-size:12.5px;opacity:.75;margin-top:2px}
.badge{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px}
.b-adult{background:#ede3fb;color:#5b2ea6}.b-walk{background:#ffe6cc;color:#9a4a00}.b-late{background:#d93025;color:#fff}
.empty{font-size:14px;opacity:.7;padding:2px 4px}
details{margin-top:14px;font-size:14px}summary{font-weight:700;opacity:.8}
</style>
</head>
<body>
<main>
<h1>夢アカ 運営画面（検証用）</h1>
<p id="who">読み込んでいます…</p>
<nav id="nav" class="hide">
  <button data-tab="days" class="on">活動日</button>
  <button data-tab="devices" id="tDevices">受付の端末</button>
  <a href="./">受付の画面へ</a>
</nav>
<div id="msg"></div>
<div id="days"></div>
<div id="devices" class="hide"></div>
<div id="foot" class="hide"><small>細かい修正が必要なときは、<a id="sheet" target="_blank" rel="noopener">もとの表（スプレッドシート）</a>を開いてください。</small></div>
</main>
<script>
(function(){
var API='https://yasuulab-n8n.xvps.jp/webhook/yumeaka-yoyaku-kanri-api-4c81d9';
var STORE='yumeaka_uketsuke_v1';
var $=function(i){return document.getElementById(i)};
var me=null;try{me=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){}
var busy=false;
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function msg(t,c){var m=$('msg');m.textContent=t||'';m.className=c||'';m.style.display=t?'block':'none'}
function call(o,keep){if(busy)return;busy=true;var b=new URLSearchParams();o.device=me.device;o.key=me.key;for(var k in o)b.set(k,o[k]);
fetch(API,{method:'POST',body:b}).then(function(x){return x.json()}).then(function(r){busy=false;
if(r.auth===false){$('who').textContent='';$('nav').className='hide';['days','devices'].forEach(function(i){$(i).textContent=''});msg(r.message+'\n受付の画面から、端末を登録し直してください。','ng');return}
if(r.reload){if(r.self){msg('この端末を止めました。','ok');return}var m=r.message,c=r.cls;busy=false;load(function(){msg(m,c)});return}
render(r);if(!keep)msg('')}).catch(function(){busy=false;msg('通信に失敗しました。もう一度試してください。','ng')})}
function load(after){busy=false;var b=new URLSearchParams();b.set('op','overview');b.set('device',me.device);b.set('key',me.key);busy=true;
fetch(API,{method:'POST',body:b}).then(function(x){return x.json()}).then(function(r){busy=false;if(r.auth===false){msg(r.message,'ng');return}render(r);if(after)after()}).catch(function(){busy=false;msg('通信に失敗しました。','ng')})}
function people(title,list){var w=document.createDocumentFragment();w.appendChild(el('h3','',title+'（'+list.length+'人）'));
if(!list.length){w.appendChild(el('div','txt','いません'));return w}
var t=el('table');list.forEach(function(p){var tr=el('tr');tr.appendChild(el('td','',p.name));tr.appendChild(el('td','','No. '+p.no));tr.appendChild(el('td','',p.time));
var td=el('td');td.appendChild(el('span','tag '+(p.status==='来ている'?'here':'yet'),p.status||(p.here?'来ている':'まだ')));tr.appendChild(td);t.appendChild(tr)});w.appendChild(t);return w}
function line(title,arr){var w=document.createDocumentFragment();w.appendChild(el('h3','',title+'（'+arr.length+'人）'));w.appendChild(el('div','txt',arr.length?arr.join('、'):'いません'));return w}
function copy(text,btn){var done=function(){var o=btn.textContent;btn.textContent='コピーしました';setTimeout(function(){btn.textContent=o},1500)};
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(function(){msg('コピーできませんでした。文面を長押しして選んでください。','ng')})}else msg('この端末ではコピーのボタンが使えません。文面を長押しして選んでください。','ng')}
function render(r){
$('who').textContent=r.me.name+' さんの端末（'+r.me.device+'）'+(r.me.isAdmin?'':'　※リーダーズ用の表示です');
$('nav').className='';$('foot').className='';$('sheet').href=r.sheetUrl;
$('tDevices').className=r.me.isAdmin?'':'hide';
var D=$('days');D.textContent='';
if(!r.days.length)D.appendChild(el('div','card','これからの活動日は登録されていません。'));
r.days.forEach(function(d){
var isToday=d.id===r.today;
var toMin=function(t){var p=String(t).split(':');return p[0]*60+ +p[1]};
var all=d.kids.concat(d.adults).concat(d.walkin||[]);
var G={yet:[],here:[],gone:[]};
all.forEach(function(p){p.late=isToday&&p.status==='まだ'&&p.arr&&toMin(r.hm)>=toMin(p.arr)+15;G[p.status==='来ている'?'here':p.status==='帰った'?'gone':'yet'].push(p)});
G.yet.sort(function(a,b){return (b.late?1:0)-(a.late?1:0)||(a.arr<b.arr?-1:1)});
var c=el('div','card');
var hd=el('div','dayhead');hd.appendChild(el('h2','',d.label+(isToday?'（今日）':'')));hd.appendChild(el('span','floor',d.floor));c.appendChild(hd);
var m=el('div','meta');m.appendChild(el('div','','開いている時間 '+d.hours+'　みんながそろう時間 '+d.core));m.appendChild(el('div','','予約の締切 '+d.deadline+(d.closed?'（締切済み。変更と取り消しは受付中）':'')+'　席 '+d.kids.length+' / 10'));c.appendChild(m);
var tiles=el('div','tiles');
[['yet','まだ来ていない',G.yet.length],['here','来ている',G.here.length],['gone','帰った',G.gone.length]].forEach(function(t){var b=el('div','tile t-'+t[0]);b.appendChild(el('div','num',String(t[2])));b.appendChild(el('div','lab',t[1]));tiles.appendChild(b)});
c.appendChild(tiles);
var total=all.length||1;var bar=el('div','bar');
[['here',G.here.length],['gone',G.gone.length],['yet',G.yet.length]].forEach(function(t){if(!t[1])return;var sgm=el('div','seg t-'+t[0]);sgm.style.width=(t[1]/total*100)+'%';bar.appendChild(sgm)});
c.appendChild(bar);
var sec=function(key,icon,title,list,empty){var w=el('div','sec s-'+key);w.appendChild(el('div','sechead',icon+' '+title+'　'+list.length+'人'));
if(!list.length){w.appendChild(el('div','empty',empty));c.appendChild(w);return}
var g=el('div','chips');list.forEach(function(p){var ch=el('div','chip'+(p.late?' late':''));
var top=el('div','ctop');top.appendChild(el('span','cname',p.name));
if(p.adult)top.appendChild(el('span','badge b-adult','見守り'));
if(p.guest)top.appendChild(el('span','badge b-walk','ゲスト'));else if(p.walkin)top.appendChild(el('span','badge b-walk','予約なし'));
if(p.late)top.appendChild(el('span','badge b-late','遅れ'));ch.appendChild(top);
var sub=key==='yet'?(p.arr+' に来る予定'+(p.time?'（'+p.time+'）':'')):key==='here'?('到着 '+p.at+(p.time?'　予定 '+p.time:'')):(p.at+'〜'+p.out+' にいた');
ch.appendChild(el('div','csub','No. '+p.no+'　'+sub));g.appendChild(ch)});w.appendChild(g);c.appendChild(w)};
sec('yet','⏳','まだ来ていない',G.yet,'全員そろっています');
sec('here','🟢','来ている',G.here,'まだ誰も来ていません');
sec('gone','🚪','帰った',G.gone,'まだ誰も帰っていません');
var det=el('details');det.appendChild(el('summary','','予約も取り消しもしていないメンバー　'+d.silent.length+'人'));det.appendChild(el('div','txt',d.silent.length?d.silent.join('、'):'いません'));c.appendChild(det);
D.appendChild(c)});
var V=$('devices');V.textContent='';
if(r.devices){var c=el('div','card');c.appendChild(el('h2','','受付に使える端末'));var t=el('table');
r.devices.forEach(function(x){var tr=el('tr');tr.appendChild(el('td','',x.name+(x.mine?'（この端末）':'')));tr.appendChild(el('td','',x.id));tr.appendChild(el('td','',x.at?x.at.slice(0,16):''));
var td=el('td');td.appendChild(el('span','tag '+(x.state==='有効'?'live':x.state==='停止'?'stop':'yet'),x.state));tr.appendChild(td);
var a=el('td');if(x.state==='有効'){var k=el('button','act warn','止める');k.onclick=function(){if(k.dataset.sure){call({op:'stopDevice',target:x.id})}else{k.dataset.sure='1';k.textContent=x.mine?'この端末を止める（もう一度押す）':'本当に止める';setTimeout(function(){delete k.dataset.sure;k.textContent='止める'},4000)}};a.appendChild(k)}tr.appendChild(a);t.appendChild(tr)});
c.appendChild(t);c.appendChild(el('small','','新しい端末の登録は、Discordの「受付の端末を登録する」ボタンから行います。止めた端末は、登録し直すまで使えません。'));V.appendChild(c)}
}
Array.prototype.forEach.call(document.querySelectorAll('nav button'),function(b){b.onclick=function(){Array.prototype.forEach.call(document.querySelectorAll('nav button'),function(x){x.className=x.className.replace(/\s*on/,'')});b.className=(b.className+' on').trim();['days','devices'].forEach(function(i){$(i).className=i===b.dataset.tab?'':'hide'})}});
if(!me||!me.device||!me.key){$('who').textContent='';msg('この端末は登録されていません。\n受付の画面から登録してください。','ng');var a=el('a','','受付の画面へ');a.href='./';$('days').appendChild(a)}else load();
})();
</script>
</body>
</html>
