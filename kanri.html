<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>夢アカ 運営画面（検証用）</title>
<meta name="theme-color" content="#16213e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css?v=11">
</head>
<body>
<header class="band"><div class="band-in">
  <div class="mark">YUME ACADEMY<small>横須賀プログラミング"夢"アカデミー</small></div>
  <div class="band-title">運営<small id="who">　</small></div>
</div></header>
<main>
<div id="nav" class="pills hide">
  <button data-tab="days" class="on">活動日</button>
  <button data-tab="people">登録の状況</button>
  <button data-tab="devices" id="tDevices">受付の端末</button>
</div>
<div id="msg" class="note hide"></div>
<div class="loading" id="load"><span class="ring"></span>今日のようすを集めています</div>
<div id="days"><div class="sk"><i class="h"></i><i class="w80"></i><i class="block"></i><i class="w60"></i></div></div>
<div id="people" class="hide"></div>
<div id="devices" class="hide"></div>
<div id="foot" class="hide"><small class="foot">細かい修正が必要なときは、<a id="sheet" target="_blank" rel="noopener">もとの表（スプレッドシート）</a>を開いてください。</small></div>
</main>
<nav class="dock"><div class="dock-in">
  <a href="./"><b>▣</b>受付</a>
  <a href="kanri.html" class="on"><b>☰</b>運営</a>
</div></nav>
<script>
(function(){
var API='https://yasuulab-n8n.xvps.jp/webhook/yumeaka-yoyaku-kanri-api-4c81d9';
var STORE='yumeaka_uketsuke_v1';
var $=function(i){return document.getElementById(i)};
var me=null;try{me=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){}
var busy=false;
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function msg(t,c){var m=$('msg');m.textContent=t||'';m.className='note '+(c||'ng')+(t?'':' hide')}
function call(o,keep){if(busy)return;busy=true;document.body.classList.add('busy');var b=new URLSearchParams();o.device=me.device;o.key=me.key;for(var k in o)b.set(k,o[k]);
fetch(API,{method:'POST',body:b}).then(function(x){return x.json()}).then(function(r){busy=false;document.body.classList.remove('busy');$('load').className='loading hide';
if(r.auth===false){$('who').textContent='';$('nav').className='pills hide';['days','people','devices'].forEach(function(i){$(i).textContent=''});msg(r.message+'\n受付の画面から、端末を登録し直してください。','ng');return}
if(r.reload){if(r.self){msg('この端末を止めました。','ok');return}var m=r.message,c=r.cls;busy=false;load(function(){msg(m,c)});return}
render(r);if(!keep)msg('')}).catch(function(){busy=false;document.body.classList.remove('busy');$('load').className='loading hide';msg('通信に失敗しました。もう一度試してください。','ng')})}
function load(after){busy=false;var b=new URLSearchParams();b.set('op','overview');b.set('device',me.device);b.set('key',me.key);busy=true;document.body.classList.add('busy');
fetch(API,{method:'POST',body:b}).then(function(x){return x.json()}).then(function(r){busy=false;document.body.classList.remove('busy');$('load').className='loading hide';if(r.auth===false){msg(r.message,'ng');return}render(r);if(after)after()}).catch(function(){busy=false;document.body.classList.remove('busy');$('load').className='loading hide';msg('通信に失敗しました。','ng')})}
function people(title,list){var w=document.createDocumentFragment();w.appendChild(el('h3','',title+'（'+list.length+'人）'));
if(!list.length){w.appendChild(el('div','txt','いません'));return w}
var t=el('table');list.forEach(function(p){var tr=el('tr');tr.appendChild(el('td','',p.name));tr.appendChild(el('td','','No. '+p.no));tr.appendChild(el('td','',p.time));
var td=el('td');td.appendChild(el('span','tag '+(p.status==='来ている'?'here':'yet'),p.status||(p.here?'来ている':'まだ')));tr.appendChild(td);t.appendChild(tr)});w.appendChild(t);return w}
function line(title,arr){var w=document.createDocumentFragment();w.appendChild(el('h3','',title+'（'+arr.length+'人）'));w.appendChild(el('div','txt',arr.length?arr.join('、'):'いません'));return w}
function copy(text,btn){var done=function(){var o=btn.textContent;btn.textContent='コピーしました';setTimeout(function(){btn.textContent=o},1500)};
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(function(){msg('コピーできませんでした。文面を長押しして選んでください。','ng')})}else msg('この端末ではコピーのボタンが使えません。文面を長押しして選んでください。','ng')}
var P=null;
function faces(){if(!P)return;Array.prototype.forEach.call(document.querySelectorAll('.ava'),function(a){var s=P[a.dataset.no];if(s){a.style.backgroundImage='url('+s+')';a.className='ava has'}})}
function loadFaces(){var b=new URLSearchParams();b.set('op','photos');b.set('device',me.device);b.set('key',me.key);fetch(API,{method:'POST',body:b}).then(function(x){return x.json()}).then(function(r){if(r&&r.photos){P=r.photos;faces()}}).catch(function(){})}
function render(r){$('load').className='loading hide';setTimeout(function(){if(P)faces();else loadFaces()},0);
$('who').textContent=r.me.name+' さんの端末'+(r.me.isAdmin?'':'（リーダーズ用の表示）');
$('nav').className='pills';$('foot').className='';$('sheet').href=r.sheetUrl;
$('tDevices').className=r.me.isAdmin?'':'hide';
var D=$('days');D.textContent='';
if(!r.days.length)D.appendChild(el('div','card','これからの活動日は登録されていません。'));
r.days.forEach(function(d){
var isToday=d.id===r.today;
var toMin=function(t){var p=String(t).split(':');return p[0]*60+ +p[1]};
var all=d.kids.concat(d.adults).concat(d.walkin||[]);
var G={yet:[],here:[],gone:[]};
all.forEach(function(p){p.late=isToday&&p.status==='まだ'&&p.arr&&toMin(r.hm)>=toMin(p.arr)+15;G[p.status==='来ている'?'here':p.status==='帰った'?'gone':'yet'].push(p)});
G.yet.sort(function(a,b){return (b.late?1:0)-(a.late?1:0)||(a.arr<b.arr?-1:1)});
var c=el('div','card');
var hd=el('div','dayhead');hd.appendChild(el('h2','',d.label+(isToday?'（今日）':'')));hd.appendChild(el('span','floor',d.floor));c.appendChild(hd);
var m=el('div','meta');m.appendChild(el('div','','開いている時間 '+d.hours+'　みんながそろう時間 '+d.core));m.appendChild(el('div','','予約の締切 '+d.deadline+(d.closed?'（締切済み。変更と取り消しは受付中）':'')+'　席 '+d.kids.length+' / 10'));c.appendChild(m);
var tiles=el('div','tiles');
[['yet','まだ来ていない',G.yet.length],['here','来ている',G.here.length],['gone','帰った',G.gone.length]].forEach(function(t){var b=el('div','tile t-'+t[0]);b.appendChild(el('div','num',String(t[2])));b.appendChild(el('div','lab',t[1]));tiles.appendChild(b)});
c.appendChild(tiles);
var total=all.length||1;var bar=el('div','bar');
[['here',G.here.length],['gone',G.gone.length],['yet',G.yet.length]].forEach(function(t){if(!t[1])return;var sgm=el('div','seg t-'+t[0]);sgm.style.width=(t[1]/total*100)+'%';bar.appendChild(sgm)});
c.appendChild(bar);
var sec=function(key,icon,title,list,empty){var w=el('div','sec s-'+key);w.appendChild(el('div','sechead',icon+' '+title+'　'+list.length+'人'));
if(!list.length){w.appendChild(el('div','empty',empty));c.appendChild(w);return}
var g=el('div','chips');list.forEach(function(p){var ch=el('div','chip wa'+(p.late?' late':''));var av=el('span','ava',p.name.slice(0,1));av.dataset.no=p.no;ch.appendChild(av);var bd=el('div');ch.appendChild(bd);
var top=el('div','ctop');top.appendChild(el('span','cname',p.name));
if(p.adult)top.appendChild(el('span','badge b-adult','見守り'));
if(p.guest)top.appendChild(el('span','badge b-walk','ゲスト'));else if(p.walkin)top.appendChild(el('span','badge b-walk','予約なし'));
if(p.late)top.appendChild(el('span','badge b-late','遅れ'));if(!p.hasPhoto&&!p.guest)top.appendChild(el('span','badge b-nophoto','写真まだ'));bd.appendChild(top);
var sub=key==='yet'?(p.arr+' に来る予定'+(p.time?'（'+p.time+'）':'')):key==='here'?('到着 '+p.at+(p.time?'　予定 '+p.time:'')):(p.at+'〜'+p.out+' にいた');
bd.appendChild(el('div','csub','No. '+p.no+'　'+sub));g.appendChild(ch)});w.appendChild(g);c.appendChild(w)};
sec('yet','⏳','まだ来ていない',G.yet,'全員そろっています');
sec('here','🟢','来ている',G.here,'まだ誰も来ていません');
sec('gone','🚪','帰った',G.gone,'まだ誰も帰っていません');
var det=el('details');det.appendChild(el('summary','','予約も取り消しもしていないメンバー　'+d.silent.length+'人'));det.appendChild(el('div','txt',d.silent.length?d.silent.join('、'):'いません'));c.appendChild(det);
D.appendChild(c)});
var Q=$('people');Q.textContent='';
if(r.people){var pc=el('div','card');pc.appendChild(el('h2','','登録の状況'));
var act=r.people.filter(function(p){return !p.state||p.state==='在籍'});var nC=act.filter(function(p){return p.confirmed}).length,nP=act.filter(function(p){return p.hasPhoto}).length,nL=r.people.length-act.length;
pc.appendChild(el('div','meta','在籍 '+act.length+'人　本人の確認 '+nC+'人　顔写真 '+nP+'人'+(nL?'　在籍でないのに写真が残っている人 '+nL+'人':'')));
var pt=el('table');r.people.forEach(function(p){var tr=el('tr');var a=el('td');a.appendChild(el('div','cname',p.name));a.appendChild(el('div','csub','No. '+p.no+'　'+p.group+((p.state&&p.state!=='在籍')?'　名簿の状態：'+p.state:'')));tr.appendChild(a);
[[p.confirmed,'確認済み','確認まだ'],[p.hasPhoto,'写真あり','写真まだ'],[p.linked,'Discord結びつき済み',p.discordOk?'Discordまだ':'Discordなし']].forEach(function(x,i){var td=el('td');td.appendChild(el('span','tag '+(x[0]?'live':'yet'),x[0]?x[1]:x[2]));
if(i===1&&p.hasPhoto&&r.me.isAdmin){var k=el('button','act quiet','写真を消す');k.style.display='block';k.style.marginTop='6px';k.onclick=function(){if(k.dataset.sure){call({op:'removePhoto',target:p.no})}else{k.dataset.sure='1';k.className='act warn';k.textContent='本当に消す（戻せません）';setTimeout(function(){delete k.dataset.sure;k.className='act quiet';k.textContent='写真を消す'},6000)}};td.appendChild(k)}
tr.appendChild(td)});pt.appendChild(tr)});
pc.appendChild(pt);pc.appendChild(el('small','foot','運営とメンターは、Discordの「自分の登録を確かめる」ボタンから、本人が確認と顔写真の登録をします。メンバーの顔写真は、活動日に受付で撮ります。'+(r.me.isAdmin?'退会・修了した人の顔写真は「写真を消す」で消します。消した写真は元に戻せません。':'')));Q.appendChild(pc)}
var V=$('devices');V.textContent='';
if(r.devices){var c=el('div','card');c.appendChild(el('h2','','受付に使える端末'));var t=el('table');
r.devices.forEach(function(x){var tr=el('tr');tr.appendChild(el('td','',x.name+(x.mine?'（この端末）':'')));tr.appendChild(el('td','',x.id));tr.appendChild(el('td','',x.at?x.at.slice(0,16):''));
var td=el('td');td.appendChild(el('span','tag '+(x.state==='有効'?'live':x.state==='停止'?'stop':'yet'),x.state));tr.appendChild(td);
var a=el('td');if(x.state==='有効'){var k=el('button','act warn','止める');k.onclick=function(){if(k.dataset.sure){call({op:'stopDevice',target:x.id})}else{k.dataset.sure='1';k.textContent=x.mine?'この端末を止める（もう一度押す）':'本当に止める';setTimeout(function(){delete k.dataset.sure;k.textContent='止める'},4000)}};a.appendChild(k)}tr.appendChild(a);t.appendChild(tr)});
c.appendChild(t);c.appendChild(el('small','','新しい端末の登録は、Discordの「受付の端末を登録する」ボタンから行います。止めた端末は、登録し直すまで使えません。'));V.appendChild(c)}
}
Array.prototype.forEach.call(document.querySelectorAll('#nav button'),function(b){b.onclick=function(){Array.prototype.forEach.call(document.querySelectorAll('#nav button'),function(x){x.className=x.className.replace(/\s*on/,'')});b.className=(b.className+' on').trim();['days','people','devices'].forEach(function(i){$(i).className=i===b.dataset.tab?'':'hide'})}});
if(!me||!me.device||!me.key){$('who').textContent='';$('load').className='loading hide';$('days').textContent='';msg('この端末は登録されていません。\n受付の画面から登録してください。','ng');var a=el('a','','受付の画面へ');a.href='./';$('days').appendChild(a)}else load();
})();
</script>
</body>
</html>
