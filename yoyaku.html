<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#16213e">
<title>夢アカ 予約（検証用）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css?v=11">
<style>
body{padding-bottom:24px}
.hello{font-family:var(--round);font-weight:900;font-size:24px;margin:10px 2px 0}
.hello small{display:block;font-size:13px;font-weight:500;color:var(--ink-2)}
/* 予約票：左に日付の半券、ミシン目をはさんで右に中身 */
.ticket{display:flex;background:var(--paper);border-radius:18px;margin:14px 0;border:1px solid var(--line);overflow:hidden}
.stub{flex:none;width:92px;background:var(--ink);color:#fff;text-align:center;padding:16px 6px;display:flex;flex-direction:column;justify-content:center;position:relative}
.stub .mo{font-family:var(--round);font-weight:700;font-size:14px;opacity:.85}
.stub .dd{font-family:var(--round);font-weight:900;font-size:44px;line-height:1}
.stub .wd{font-family:var(--round);font-weight:700;font-size:15px;margin-top:2px}
.stub::after{content:"";position:absolute;right:-1px;top:10px;bottom:10px;border-right:3px dotted var(--paper)}
.ticket.booked .stub{background:var(--brand)}
.tbody{flex:1;padding:14px 14px 12px;min-width:0}
.state{display:flex;align-items:center;gap:10px}
.state .big{font-family:var(--round);font-weight:900;font-size:26px;line-height:1.2}
.state .lab{font-size:13px;font-weight:700;color:var(--ink-2)}
.ticket.booked .state .big{color:var(--here-ink)}
.mini{width:58px;height:58px;font-size:15px;border-width:4px;color:var(--brand);margin-left:auto}
.mini::after{inset:3px;border-width:1.5px}
.seats{display:flex;gap:4px;align-items:center;margin:10px 0 2px;flex-wrap:wrap}
.seats i{width:15px;height:15px;border-radius:4px;background:var(--line);display:block}
.seats i.f{background:var(--ink)}
.seats span{font-size:12.5px;color:var(--ink-2);margin-left:6px}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 4px}
.step .cap{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.step .row{display:flex;align-items:center;border:2px solid var(--line);border-radius:12px;overflow:hidden;margin-top:3px}
.step button{border:0;background:var(--bg);color:var(--ink);font-size:22px;font-weight:900;width:44px;height:46px;flex:none}
.step button:disabled{opacity:.3}
.step .val{flex:1;text-align:center;font-family:var(--round);font-weight:900;font-size:20px}
.ticket .btn{margin:10px 0 0}
</style>
</head>
<body>
<header class="band"><div class="band-in">
  <div class="mark">YUME ACADEMY<small>横須賀プログラミング"夢"アカデミー</small></div>
  <div class="band-title">活動日の予約<small>検証用</small></div>
</div></header>
<main>
<p class="hello" id="who"></p>
<div class="loading" id="load"><span class="ring"></span>予約のようすを確かめています</div>
<div id="msg" class="note hide"></div>
<div id="days"><div class="sk tk"><b></b><div><i class="h"></i><i class="w80"></i><i class="block"></i></div></div><div class="sk tk"><b></b><div><i class="h"></i><i class="w80"></i><i class="block"></i></div></div></div>
<small class="foot">このページのアドレスは、あなた専用です。ほかの人には教えないでください。</small>
</main>
<script>
(function(){
var API='https://yasuulab-n8n.xvps.jp/webhook/yumeaka-yoyaku-page-api-e7b204';
var $=function(i){return document.getElementById(i)};
var key=new URLSearchParams(location.hash.replace(/^#/,'')).get('k')||'';
var busy=false;
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function msg(t,c){var m=$('msg');m.textContent=t||'';m.className='note '+(c||'ng')+(t?'':' hide')}
function toMin(t){var p=t.split(':');return p[0]*60+ +p[1]}
function toHM(m){return ('0'+Math.floor(m/60)).slice(-2)+':'+('0'+m%60).slice(-2)}
function busyOn(v){busy=v;document.body.classList[v?'add':'remove']('busy');Array.prototype.forEach.call(document.querySelectorAll('#days button'),function(x){x.disabled=v})}
function call(o){if(busy)return;busyOn(true);var b=new URLSearchParams();o.key=key;for(var k in o)b.set(k,o[k]);
fetch(API,{method:'POST',body:b}).then(function(x){return x.json()}).then(function(r){busyOn(false);render(r)}).catch(function(){busyOn(false);$('load').className='loading hide';msg('通信に失敗しました。もう一度試してください。','ng')})}
function stepper(cap,val,min,max,onchange){var w=el('div','step');w.appendChild(el('div','cap',cap));var row=el('div','row');
var a=el('button','','−'),v=el('div','val',toHM(val)),b=el('button','','＋');a.setAttribute('aria-label',cap+'を30分早める');b.setAttribute('aria-label',cap+'を30分遅らせる');
var st={v:val,min:min,max:max,set:function(){v.textContent=toHM(st.v);a.disabled=st.v<=st.min;b.disabled=st.v>=st.max}};
a.onclick=function(){if(st.v>st.min){st.v-=30;st.set();onchange()}};b.onclick=function(){if(st.v<st.max){st.v+=30;st.set();onchange()}};
row.appendChild(a);row.appendChild(v);row.appendChild(b);w.appendChild(row);st.el=w;st.set();return st}
function render(r){
$('load').className='loading hide';
if(!r.ok){$('who').textContent='';$('days').textContent='';msg(r.message||'このリンクは使えません。','ng');return}
$('who').textContent=r.name+' さん';$('who').appendChild(el('small','','No. '+r.no));msg(r.message,r.cls);
var box=$('days');box.textContent='';
if(!r.days.length){box.appendChild(el('div','card','いま予約できる活動日はありません。'))}
r.days.forEach(function(d){
var p=d.id.split('-');var wd=(/（(.)）/.exec(d.label)||[])[1]||'';
var t=el('div','ticket'+(d.reserved?' booked':''));
var s=el('div','stub');s.appendChild(el('div','mo',(+p[1])+'月'));s.appendChild(el('div','dd',String(+p[2])));s.appendChild(el('div','wd',wd+'曜日'));t.appendChild(s);
var b=el('div','tbody');
var st=el('div','state');var tx=el('div');
if(d.reserved){tx.appendChild(el('div','lab','予約票'));tx.appendChild(el('div','big',d.arr+'〜'+d.lea));st.appendChild(tx);st.appendChild(el('div','stamp mini','予約済'))}
else{tx.appendChild(el('div','lab','まだ予約していません'));tx.appendChild(el('div','big','行く？'));st.appendChild(tx)}
b.appendChild(st);
var seats=el('div','seats');for(var i=0;i<10;i++){seats.appendChild(el('i',i<d.seats?'f':''))}
seats.appendChild(el('span','','いま '+d.seats+'人が予約'+(d.seats>10?'（10人をこえています）':'')));b.appendChild(seats);
b.appendChild(el('div','meta','開いている時間 '+d.open+'〜'+d.close+'　みんながそろう時間 '+d.core));
b.appendChild(el('div','meta','締切 '+d.deadline+(d.late?'（過ぎていますが、予約と取り消しはできます）':'')));
var go=el('button','btn',d.reserved?'この時刻に変える':'この時刻で予約する');
var lo=toMin(d.open),hi=toMin(d.close);
var changed=function(){if(A.v>=B.v){B.v=Math.min(hi,A.v+30);B.set()}if(d.reserved){go.className='btn'+((toHM(A.v)===d.arr&&toHM(B.v)===d.lea)?' hide':'')}};
var A=stepper('来る時刻',toMin(d.arr),lo,hi-30,function(){changed()});
var B=stepper('帰る時刻',toMin(d.lea),lo+30,hi,function(){if(B.v<=A.v){A.v=Math.max(lo,B.v-30);A.set()}changed()});
var steps=el('div','steps');steps.appendChild(A.el);steps.appendChild(B.el);b.appendChild(steps);
go.onclick=function(){call({op:'reserve',day:d.id,arr:toHM(A.v),lea:toHM(B.v)})};b.appendChild(go);
if(d.reserved){go.className='btn hide';var x=el('button','btn quiet','行けなくなったので取り消す');x.onclick=function(){call({op:'cancel',day:d.id})};b.appendChild(x)}
t.appendChild(b);box.appendChild(t)})}
if(!key){$('load').className='loading hide';$('days').textContent='';msg('このページは、あなた専用のリンクから開いてください。','ng')}else call({op:'view'});
})();
</script>
</body>
</html>
